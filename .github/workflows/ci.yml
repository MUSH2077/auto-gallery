name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-static:
    name: Backend static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        working-directory: backend
        run: pip install --require-hashes -r requirements.txt
      - name: Audit Python dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: backend/requirements.txt
          require-hashes: true
      - name: Lint backend
        working-directory: backend
        run: ruff check app tests
      - name: Check generated API contracts
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-32chars-minimum-value
          ADMIN_PASSWORD: ci-admin-password
          DATABASE_URL: postgresql+asyncpg://autogallery:test-db@localhost:5432/autogallery
          REDIS_URL: redis://localhost:6379/0
          MEILI_MASTER_KEY: ci-meilisearch-master-key-32chars
        run: python scripts/export_api_contracts.py --check

  backend-tests:
    name: Backend tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [a-f, gitllery, imports-c-l, imports-m-r, jobs, large-library, manual-upload-validation, manual-upload-linking, manual-upload-import-images, manual-upload-import-video, media-migrations, n-z]
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: autogallery
          POSTGRES_PASSWORD: test-db
          POSTGRES_DB: autogallery
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7@sha256:595cc6f2bb3af6e03347b90deb6123c6aa2c81dea05ce08128de8a174b6ac67b
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install system dependencies
        if: >-
          ${{ matrix.shard == 'media-migrations' }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev ffmpeg
      - name: Install Python dependencies
        working-directory: backend
        run: pip install --require-hashes -r requirements.txt
      - name: Start Meilisearch for search integration tests
        if: ${{ matrix.shard == 'n-z' }}
        run: |
          docker run --detach --rm \
            --name auto-gallery-ci-meilisearch \
            --publish 7700:7700 \
            --env MEILI_MASTER_KEY=ci-meilisearch-master-key-32chars \
            --env MEILI_ENV=development \
            --env MEILI_HTTP_ADDR=0.0.0.0:7700 \
            getmeili/meilisearch:v1.12@sha256:c9fac23131cca4db95173d41cc50fd5639121ee381795528fdd7522d7978a7b8
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:7700/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs auto-gallery-ci-meilisearch
          exit 1
      - name: Run test shard
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://autogallery:test-db@localhost:5432/autogallery
          REDIS_URL: redis://localhost:6379/0
        run: |
          shopt -s nullglob
          case "${{ matrix.shard }}" in
            a-f) test_files=(tests/test_{a,b,c,d,e,f}*.py) ;;
            gitllery) test_files=(tests/test_g*.py) ;;
            imports-c-l) test_files=(tests/test_import_{c,d,e,f,g,h,i,j,k,l}*.py) ;;
            imports-m-r) test_files=(tests/test_import_{m,n,o,p,q,r}*.py) ;;
            jobs) test_files=(tests/test_j*.py) ;;
            large-library) test_files=(tests/test_l*.py) ;;
            manual-upload-validation)
              test_files=(
                tests/test_manual_upload.py::test_save_upload_happy_path
                tests/test_manual_upload.py::test_save_upload_rejects_bad_magic_bytes
                tests/test_manual_upload.py::test_save_upload_rejects_disallowed_extension
                tests/test_manual_upload.py::test_save_upload_quota_exceeded
                tests/test_manual_upload.py::test_save_upload_creator_id_without_curation_is_forbidden
              )
              ;;
            manual-upload-linking)
              test_files=(
                tests/test_manual_upload.py::test_save_upload_creator_id_with_curation_links_target_creator
                tests/test_manual_upload.py::test_save_upload_personal_space_reused_across_two_uploads
              )
              ;;
            manual-upload-import-images)
              test_files=(
                tests/test_manual_upload.py::test_save_upload_runs_through_real_import_runner
                tests/test_manual_upload.py::test_save_upload_honors_manual_is_nsfw_flag
              )
              ;;
            manual-upload-import-video)
              test_files=(
                tests/test_manual_upload.py::test_save_upload_video_asset_imports_through_real_import_runner
              )
              ;;
            media-migrations) test_files=(tests/test_media*.py tests/test_migrations*.py) ;;
            n-z)
              export MEILI_URL=http://127.0.0.1:7700
              export MEILI_MASTER_KEY=ci-meilisearch-master-key-32chars
              test_files=(tests/test_{n,o,p,q,r,s,t,u,v,w,x,y,z}*.py)
              ;;
          esac
          python -m pytest "${test_files[@]}"
      - name: Stop Meilisearch integration service
        if: ${{ always() && matrix.shard == 'n-z' }}
        run: docker stop auto-gallery-ci-meilisearch || true

  extracted-python-quality:
    name: Extracted Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: autogallery
          POSTGRES_PASSWORD: test-db
          POSTGRES_DB: autogallery
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7@sha256:595cc6f2bb3af6e03347b90deb6123c6aa2c81dea05ce08128de8a174b6ac67b
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install runtime dependencies
        working-directory: backend
        run: pip install --require-hashes -r requirements.txt
      - name: Install pinned development quality tools
        run: pip install mypy==2.3.1 pytest-cov==7.1.0
      - name: Check extracted module types and expanded lint rules
        working-directory: backend
        run: |
          modules=(
            app/services/search_pagination.py
            app/services/search_filters.py
            app/services/search_projection_fields.py
            app/jobs/import_execution.py
            app/services/resource_pressure_sampling.py
            app/services/resource_pressure_state.py
            app/services/resource_pressure_snapshot.py
          )
          ruff check --select E4,E7,E9,F "${modules[@]}"
          mypy --cache-dir=/tmp/auto-gallery-mypy --follow-imports=skip --ignore-missing-imports "${modules[@]}"
      - name: Report extracted module coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://autogallery:test-db@localhost:5432/autogallery
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m pytest \
            --cov=app.services.search_pagination \
            --cov=app.services.search_filters \
            --cov=app.services.search_projection_fields \
            --cov=app.jobs.import_execution \
            --cov=app.services.resource_pressure_sampling \
            --cov=app.services.resource_pressure_state \
            --cov=app.services.resource_pressure_snapshot \
            --cov-report=term-missing \
            --cov-report=xml:coverage-extracted.xml \
            tests/test_search_algorithms.py \
            tests/test_import_finalization_recovery.py \
            tests/test_resource_pressure.py
          {
            echo '### Extracted Python module coverage'
            echo '```'
            python -m coverage report -m
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [backend-static, backend-tests, extracted-python-quality]
    if: ${{ always() }}
    steps:
      - name: Verify backend checks
        env:
          STATIC_RESULT: ${{ needs.backend-static.result }}
          TEST_RESULT: ${{ needs.backend-tests.result }}
          QUALITY_RESULT: ${{ needs.extracted-python-quality.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$TEST_RESULT" = success
          test "$QUALITY_RESULT" = success

  admin-web:
    name: Admin checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin-web/package-lock.json
      - name: Install dependencies
        working-directory: admin-web
        run: npm ci
      - name: Audit npm dependencies
        working-directory: admin-web
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org
      - name: Check admin translations
        working-directory: admin-web
        run: npm run check:i18n
      - name: Check shared chart contract
        working-directory: admin-web
        run: npm run check:charts
      - name: Check shared media contract
        working-directory: admin-web
        run: npm run check:media
      - name: Check unified search contract
        working-directory: admin-web
        run: npm run check:search-contract
      - name: Check canonical admin routes
        working-directory: admin-web
        run: npm run check:admin-routes
      - name: Check generated OpenAPI types
        working-directory: admin-web
        run: npm run check:api-types
      - name: Typecheck admin web
        working-directory: admin-web
        run: npm run typecheck
      - name: Check Jobs route and task tree
        working-directory: admin-web
        run: node --test tests/job-tree.mjs tests/jobs-route.mjs
      - name: Build admin web
        working-directory: admin-web
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: admin-web
        run: npx playwright install --with-deps chromium
      - name: Run admin UI quality checks
        working-directory: admin-web
        env:
          PLAYWRIGHT_MANAGE_SERVER: "1"
          PLAYWRIGHT_SERVER_MODE: "production"
        run: >-
          npx playwright test
          tests/e2e/admin-shell.spec.ts
          tests/e2e/dashboard.spec.ts
          tests/e2e/search.spec.ts
          tests/e2e/task-action-capabilities.spec.ts
          tests/e2e/task5-r3-regressions.spec.ts
          --project=chromium --workers=1

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Public repositories can enforce this without GHAS. While the repository
    # is private, opt in only after GHAS is enabled.
    if: github.event_name == 'pull_request' && (github.event.repository.private == false || vars.GHAS_ENABLED == 'true')
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check release metadata
        run: |
          test -f LICENSE
          test -f NOTICE.md
          test -f CODE_OF_CONDUCT.md
          test -f CONTRIBUTING.md
          test -f CONTRIBUTING.zh.md
          test -f GOVERNANCE.md
          test -f SECURITY.md
          test -f SUPPORT.md
          test -f .github/CODEOWNERS
          test -f .github/ISSUE_TEMPLATE/config.yml
          test -f .github/rulesets/default-branch.json
          test -f .github/rulesets/release-tags.json
          grep -q "AGPL-3.0-only" README.md
          grep -q "AGPL-3.0-only" README.zh.md
          grep -q "AGPL-3.0-only" NOTICE.md
          grep -q '^.env$' .gitignore
          test -f .env.ci
          if test -f package-lock.json && ! test -f package.json; then
            echo "root package-lock.json must not exist without root package.json"
            exit 1
          fi
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo ".env must not be tracked"
            exit 1
          fi
          if git ls-files --error-unmatch .playwright-mcp >/dev/null 2>&1; then
            echo ".playwright-mcp must not be tracked"
            exit 1
          fi
          if git ls-files --error-unmatch data >/dev/null 2>&1; then
            echo "data must not be tracked"
            exit 1
          fi
      - name: Validate repository rulesets
        run: |
          python3 -m json.tool .github/rulesets/default-branch.json >/dev/null
          python3 -m json.tool .github/rulesets/release-tags.json >/dev/null
      - name: Run privacy scan
        run: scripts/privacy-scan.sh
      - name: Validate Docker Compose config
        run: docker compose --env-file .env.ci config --quiet
      - name: Validate queue, governance, and Gitllery v1 contracts
        run: python3 scripts/check-governance-contracts.py
      - name: Build release package dry run
        run: |
          archive="$(scripts/package-release.sh ci)"
          tar -tzf "$archive" > /tmp/release-files.txt
          if grep -E '^auto-gallery-[^/]+/(\.env|data|\.claude|\.playwright-mcp|downloads|library)(/|$)' /tmp/release-files.txt; then
            echo "release package contains private/runtime paths"
            exit 1
          fi
      - name: Check key documentation links
        run: |
          test -f docs/setup.md
          test -f docs/setup.zh.md
          test -f docs/README.md
          test -f docs/distribution.md
          test -f docs/distribution.zh.md
          test -f docs/architecture.md
          test -f docs/api/openapi.json
          test -f docs/api/asyncapi.yaml
          test -f docs/api/README.zh.md
          test -f docs/api/capability-matrix.md
          test -f docs/risks.md
          test -f docs/release-checklist.md

  docker-smoke:
    name: Docker Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [backend, admin-web, repository-checks]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build images
        run: docker compose --env-file .env.ci build backend admin-web
      - name: Start stack
        run: docker compose --env-file .env.ci up -d
      - name: Wait for healthy services
        run: |
          for attempt in $(seq 1 60); do
            unhealthy="$(docker compose --env-file .env.ci ps --format '{{.Service}} {{.State}} {{.Health}}' | awk '$2 != "running" || ($3 != "" && $3 != "healthy") {print}')"
            if [ -z "$unhealthy" ]; then
              docker compose --env-file .env.ci ps
              exit 0
            fi
            echo "Waiting for services to become healthy (attempt $attempt/60):"
            echo "$unhealthy"
            sleep 5
          done
          docker compose --env-file .env.ci ps
          docker compose --env-file .env.ci logs --tail=200
          exit 1
      - name: Verify runtime
        run: COMPOSE_ENV_FILE=.env.ci scripts/verify-runtime.sh
      - name: Tear down
        if: always()
        run: docker compose --env-file .env.ci down -v
