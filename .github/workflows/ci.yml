name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev ffmpeg
      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: backend
        run: pytest

  admin-web:
    name: Admin build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin-web/package-lock.json
      - name: Install dependencies
        working-directory: admin-web
        run: npm ci
      - name: Build admin web
        working-directory: admin-web
        run: npm run build

  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release metadata
        run: |
          test -f LICENSE
          grep -q "AGPL-3.0-only" README.md
          grep -q "AGPL-3.0-only" README.zh.md
          grep -q '^.env$' .gitignore
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo ".env must not be tracked"
            exit 1
          fi
          if git ls-files --error-unmatch .playwright-mcp >/dev/null 2>&1; then
            echo ".playwright-mcp must not be tracked"
            exit 1
          fi
          if git ls-files --error-unmatch data >/dev/null 2>&1; then
            echo "data must not be tracked"
            exit 1
          fi
      - name: Run privacy scan
        run: scripts/privacy-scan.sh
      - name: Build release package dry run
        run: |
          archive="$(scripts/package-release.sh ci)"
          tar -tzf "$archive" > /tmp/release-files.txt
          if grep -E '^auto-gallery-[^/]+/(\.env|data|\.claude|\.playwright-mcp|downloads|library)(/|$)' /tmp/release-files.txt; then
            echo "release package contains private/runtime paths"
            exit 1
          fi
      - name: Check key documentation links
        run: |
          test -f docs/setup.md
          test -f docs/setup.zh.md
          test -f docs/distribution.md
          test -f docs/distribution.zh.md
          test -f docs/architecture.md
          test -f docs/risks.md
          test -f docs/release-checklist.md
