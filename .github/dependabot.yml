version: 2
# Routine version updates are intentionally low-volume. Dependabot security
# updates remain event-driven and are not restricted by allow.update-types.
updates:
  - package-ecosystem: "npm"
    directory: "/admin-web"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: "monthly"
    allow:
      - dependency-type: "all"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      admin-web:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/backend"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: "monthly"
    allow:
      - dependency-type: "all"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      backend-python:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "github_actions"
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: "monthly"
    allow:
      - dependency-type: "all"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/backend"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: "monthly"
    allow:
      - dependency-type: "all"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: "docker"
    directory: "/admin-web"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: "monthly"
    allow:
      - dependency-type: "all"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
