version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/admin-web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    groups:
      admin-web:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:20"
      timezone: "UTC"
    groups:
      backend-python:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:40"
      timezone: "UTC"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "UTC"

  - package-ecosystem: "docker"
    directory: "/admin-web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:20"
      timezone: "UTC"
