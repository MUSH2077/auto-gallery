    <text x="122" y="386" fill="#0969da" font-size="18" font-weight="700">twitter-media-timeline</text>
    <rect x="332" y="368" width="92" height="24" rx="12" fill="#f6f8fa" stroke="#d8dee4"/>
    <text x="350" y="385" fill="#57606a" font-size="12">X/Twitter</text>
    <text x="122" y="414" fill="#57606a" font-size="13">https://demo.invalid/x/atlas_ink</text>
    <circle cx="122" cy="444" r="6" fill="#bf8700"/>
