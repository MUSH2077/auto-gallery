    <text x="122" y="266" fill="#57606a" font-size="13">https://demo.invalid/pixiv/users/atlas-ink</text>
    <circle cx="122" cy="296" r="6" fill="#1a7f37"/>
    <text x="140" y="300" fill="#57606a" font-size="12">enabled · auth healthy · synced 14 minutes ago</text>
    <rect x="968" y="230" width="82" height="32" rx="6" fill="#1f883d"/>
