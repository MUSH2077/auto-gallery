  <rect x="56" y="88" width="1088" height="584" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="92" y="132" fill="#24292f" font-family="Arial, sans-serif" font-size="24" font-weight="700">Atlas Ink / Repositories</text>
  <text x="92" y="158" fill="#57606a" font-family="Arial, sans-serif" font-size="13">Every valid gallery-dl subscription URL is a syncable repository.</text>
  <g font-family="Arial, sans-serif">
