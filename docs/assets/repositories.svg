<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">auto-gallery repositories sanitized demo screenshot</title>
  <desc id="desc">Fictional subscription URLs rendered as GitHub-like repositories.</desc>
  <rect width="1200" height="720" fill="#f6f8fa"/>
  <rect width="1200" height="56" fill="#24292f"/>
