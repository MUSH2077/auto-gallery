[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-gallery-gitllery"
version = "1.0.0"
description = "Gitllery v1 portable history format and command-line client"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
gitllery = "gitllery_cli.main:main"

[tool.setuptools]
packages = ["gitllery_cli", "gitllery_format"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require a real PostgreSQL database (run inside Docker)",
]
asyncio_mode = "auto"
cache_dir = "/tmp/auto-gallery-pytest-cache"

[tool.ruff]
target-version = "py312"
line-length = 160
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
