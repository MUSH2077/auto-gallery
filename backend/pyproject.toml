[tool.pytest.ini_options]
markers = [
    "integration: tests that require a real PostgreSQL database (run inside Docker)",
]
asyncio_mode = "auto"
cache_dir = "/tmp/auto-gallery-pytest-cache"

[tool.ruff]
target-version = "py312"
line-length = 160
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
