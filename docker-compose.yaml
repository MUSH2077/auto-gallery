services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autogallery}
      POSTGRES_USER: ${POSTGRES_USER:-autogallery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${HOST_POSTGRES:-./data/docker/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autogallery}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    mem_limit: 384M

  redis:
    image: redis:7-alpine
    # noeviction: this redis also backs RQ job queues — evicting keys under
    # memory pressure would silently drop queued jobs. Overflow must error
    # loudly instead. 96mb keeps headroom under the 128M container limit.
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 96mb --maxmemory-policy noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ${HOST_REDIS:-./data/docker/redis}:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    mem_limit: 128M

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: ${MEILI_ENV:-production}
      MEILI_HTTP_ADDR: ${MEILI_HTTP_ADDR:-meilisearch:7700}
      # Self-throttle indexing instead of getting OOM-killed: bulk reindex
      # at 256M container limit died with exit 137 (2026-07-07).
      MEILI_MAX_INDEXING_MEMORY: ${MEILI_MAX_INDEXING_MEMORY:-256Mb}
      MEILI_MAX_INDEXING_THREADS: ${MEILI_MAX_INDEXING_THREADS:-2}
    volumes:
      - ${HOST_MEILISEARCH:-./data/docker/meilisearch}:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://meilisearch:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    # 8GB-NAS cap. 256M OOM-killed bulk indexing (2026-07-07); 512M still ran
    # at 76% RSS on a 711-doc library — raised for headroom as the library grows.
    mem_limit: 768M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    image: auto-gallery-backend:latest
    command: sh -c "mkdir -p /gallerydl-config/cookies && for site in pixiv twitter iwara danbooru pinterest lofter weibo bilibili; do touch /gallerydl-config/cookies/$${site}.txt; done && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${BACKEND_PORT:-8818}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autogallery}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autogallery}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      DOWNLOAD_ROOT: /downloads
      LIBRARY_ROOT: /library
      GALLERYDL_CONFIG_ROOT: /gallerydl-config
      APP_CONFIG_ROOT: /app-config
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TIMEZONE: ${TIMEZONE:-UTC}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:13000}
      # Backend serves concurrent HTTP — larger pool than the worker default
      # (2+3). 10+10 = 20 max; 7 processes stay well under pg max_connections 100.
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
    volumes:
      - ${HOST_DOWNLOADS:-./data/downloads}:/downloads
      - ${HOST_LIBRARY:-./data/library}:/library
      - ${HOST_CONFIG_GALLERYDL:-./data/config/gallery-dl}:/gallerydl-config
      - ${HOST_CONFIG_APP:-./data/config/app}:/app-config
      # alembic/versions are baked into the image via COPY . .
      # No bind mount needed — avoids WSL 2 filesystem access issues.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/system/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # Never actually OOM-killed here (checked dmesg/RestartCount 2026-07-07),
    # but 768M felt tight under load — 1G gives real headroom without
    # blowing the 8GB-NAS budget (postgres/redis/OS still need ~3G).
    mem_limit: 1g

  worker-download:
    image: auto-gallery-backend:latest
    pull_policy: never
    command: python worker_entrypoint.py downloads,downloads:pixiv,downloads:danbooru,downloads:iwara,downloads:weibo,downloads:bilibili,downloads:pinterest,downloads:lofter,downloads:x 3 --with-scheduler
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autogallery}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autogallery}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DOWNLOAD_ROOT: /downloads
      LIBRARY_ROOT: /library
      GALLERYDL_CONFIG_ROOT: /gallerydl-config
      APP_CONFIG_ROOT: /app-config
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TIMEZONE: ${TIMEZONE:-UTC}
    volumes:
      - ${HOST_DOWNLOADS:-./data/downloads}:/downloads
      - ${HOST_LIBRARY:-./data/library}:/library
      - ${HOST_CONFIG_GALLERYDL:-./data/config/gallery-dl}:/gallerydl-config
      - ${HOST_CONFIG_APP:-./data/config/app}:/app-config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, shutil, redis; assert redis.from_url(os.environ['REDIS_URL']).ping(); assert shutil.which('gallery-dl')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512M

  worker-import:
    image: auto-gallery-backend:latest
    pull_policy: never
    # Single import worker: pyvips thumbnail bursts are the biggest memory
    # spike — keep the ceiling NAS-safe (8GB box) at the cost of throughput.
    command: python worker_entrypoint.py imports 1 --with-scheduler
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autogallery}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autogallery}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DOWNLOAD_ROOT: /downloads
      LIBRARY_ROOT: /library
      GALLERYDL_CONFIG_ROOT: /gallerydl-config
      APP_CONFIG_ROOT: /app-config
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TIMEZONE: ${TIMEZONE:-UTC}
    volumes:
      - ${HOST_DOWNLOADS:-./data/downloads}:/downloads
      - ${HOST_LIBRARY:-./data/library}:/library
      - ${HOST_CONFIG_GALLERYDL:-./data/config/gallery-dl}:/gallerydl-config
      - ${HOST_CONFIG_APP:-./data/config/app}:/app-config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, redis; assert redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1g

  worker-operations:
    image: auto-gallery-backend:latest
    pull_policy: never
    command: python worker_entrypoint.py operations 1
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autogallery}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autogallery}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DOWNLOAD_ROOT: /downloads
      LIBRARY_ROOT: /library
      GALLERYDL_CONFIG_ROOT: /gallerydl-config
      APP_CONFIG_ROOT: /app-config
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TIMEZONE: ${TIMEZONE:-UTC}
    volumes:
      - ${HOST_DOWNLOADS:-./data/downloads}:/downloads
      - ${HOST_LIBRARY:-./data/library}:/library
      - ${HOST_CONFIG_GALLERYDL:-./data/config/gallery-dl}:/gallerydl-config
      - ${HOST_CONFIG_APP:-./data/config/app}:/app-config
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, redis; assert redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512M

  scheduler:
    image: auto-gallery-backend:latest
    pull_policy: never
    command: sh -c "python seed_sync.py && rq worker --with-scheduler --url redis://:${REDIS_PASSWORD}@redis:6379/0 scheduled"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autogallery}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autogallery}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DOWNLOAD_ROOT: /downloads
      LIBRARY_ROOT: /library
      GALLERYDL_CONFIG_ROOT: /gallerydl-config
      APP_CONFIG_ROOT: /app-config
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TIMEZONE: ${TIMEZONE:-UTC}
    volumes:
      - ${HOST_CONFIG_APP:-./data/config/app}:/app-config
      - ${HOST_DOWNLOADS:-./data/downloads}:/downloads
      - ${HOST_LIBRARY:-./data/library}:/library
      - ${HOST_CONFIG_GALLERYDL:-./data/config/gallery-dl}:/gallerydl-config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, redis; assert redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256M

  admin-web:
    build:
      context: ./admin-web
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_SOURCE_CODE_URL: ${NEXT_PUBLIC_SOURCE_CODE_URL:-https://github.com/MUSH2077/auto-gallery}
    ports:
      - "${ADMIN_WEB_PORT:-13000}:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      NODE_OPTIONS: "--max-old-space-size=256"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256M

volumes:
  auto_gallery_ci_downloads:
  auto_gallery_ci_library:
  auto_gallery_ci_config_app:
  auto_gallery_ci_config_gallerydl:
  auto_gallery_ci_postgres:
  auto_gallery_ci_redis:
  auto_gallery_ci_meilisearch:
