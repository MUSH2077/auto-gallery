# 8GB NAS resource profile / 8GB 内存 NAS 资源配置档
#
# Overlay on top of the base compose file — caps burst memory so import
# thumbnailing and search indexing can't push a small box into swap:
# 叠加在基础 compose 之上，压低突发内存上限，避免导入缩略图/索引把小内存机器压进交换区：
#
#   docker compose -f docker-compose.yaml -f docker-compose.nas8g.yaml up -d
#
# Totals at limits ≈ 3.3G for app services, leaving headroom for
# postgres/redis/admin-web and the NAS OS on an 8GB machine.
services:
  backend:
    mem_limit: 768M

  worker-download:
    mem_limit: 512M

  worker-import:
    # pyvips thumbnail bursts are the biggest memory spike — halve the ceiling
    # and run a single import worker.
    mem_limit: 1g
    command: python worker_entrypoint.py imports 1 --with-scheduler

  meilisearch:
    # unlimited in the base file; a small library doesn't need more than this.
    mem_limit: 256M
